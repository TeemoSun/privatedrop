[project]
name = "privatedrop"
version = "0.1.0"
description = "PrivateDrop - self-hosted Edge Drop alternative"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "bcrypt>=4.1,<5",
    "pyjwt>=2.8,<3",
    "aiofiles>=24.1,<25",
    "python-multipart>=0.0.9,<1",
    "apscheduler>=3.10,<4",
    "email-validator>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "aiosqlite>=0.20,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
