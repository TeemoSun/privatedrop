services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: privatedrop-dev-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-dev-password}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      DATABASE_URL: postgresql+asyncpg://privatedrop:${POSTGRES_PASSWORD:-privatedrop}@db:5432/privatedrop
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-devadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devminio-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-privatedrop}
      MINIO_SECURE: "false"
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5368709120}
      UPLOAD_URL_TTL_SECONDS: ${UPLOAD_URL_TTL_SECONDS:-900}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16
    container_name: privatedrop-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: privatedrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-privatedrop}
      POSTGRES_DB: privatedrop
    ports:
      - "5432:5432"
    volumes:
      - ./data/dev/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privatedrop -d privatedrop"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: privatedrop-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-devadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devminio-password}
    volumes:
      - ./data/dev/miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
