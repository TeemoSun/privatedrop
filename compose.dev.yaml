services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: privatedrop-dev-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-dev-password}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      DATABASE_URL: postgresql+asyncpg://privatedrop:${POSTGRES_PASSWORD:-privatedrop}@db:5432/privatedrop
      STORAGE_PATH: /app/data/storage
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5368709120}
      UPLOAD_URL_TTL_SECONDS: ${UPLOAD_URL_TTL_SECONDS:-900}
    volumes:
      - ./data/dev/storage:/app/data/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16
    container_name: privatedrop-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: privatedrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-privatedrop}
      POSTGRES_DB: privatedrop
    ports:
      - "5432:5432"
    volumes:
      - ./data/dev/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privatedrop -d privatedrop"]
      interval: 5s
      timeout: 3s
      retries: 10
