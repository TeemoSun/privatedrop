    <text x="984" y="581" text-anchor="middle" font-size="9.5" font-weight="600" fill="#fafafa">Quick Drop</text>

    <g transform="translate(1049,546) scale(0.62)" fill="none" stroke="#737378" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
