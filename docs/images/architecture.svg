<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" font-family="'Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#a1a1aa"/>
    </marker>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52525b"/>
      <stop offset="1" stop-color="#a1a1aa"/>
    </linearGradient>
  </defs>

  <rect width="1160" height="560" rx="20" fill="#ffffff" stroke="#e4e4e7"/>

  <!-- ================= clients ================= -->
  <g>
    <rect x="225" y="44" width="190" height="90" rx="12" fill="#fafafa" stroke="#e4e4e7"/>
    <g transform="translate(298,64) scale(0.9)" fill="none" stroke="#3f3f46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="5" width="16" height="10" rx="1.5"/><path d="M2 19h20"/>
    </g>
    <text x="320" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Desktop</text>
    <text x="320" y="122" text-anchor="middle" font-size="10.5" fill="#71717a">Browser</text>

    <rect x="485" y="44" width="190" height="90" rx="12" fill="#fafafa" stroke="#e4e4e7"/>
    <g transform="translate(569,62) scale(0.9)" fill="none" stroke="#3f3f46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7.5" y="2.5" width="9" height="19" rx="2"/><path d="M11 18.5h2"/>
    </g>
    <text x="580" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Phone</text>
    <text x="580" y="122" text-anchor="middle" font-size="10.5" fill="#71717a">Browser</text>

    <rect x="745" y="44" width="190" height="90" rx="12" fill="#fafafa" stroke="#e4e4e7"/>
    <g transform="translate(829,62) scale(0.9)" fill="none" stroke="#3f3f46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 17.5h2"/>
    </g>
    <text x="840" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">Tablet</text>
    <text x="840" y="122" text-anchor="middle" font-size="10.5" fill="#71717a">Browser</text>
  </g>

  <!-- arrows clients -> server -->
  <g stroke="#d4d4d8" stroke-width="1.5" fill="none">
    <path d="M320 138 L553 190" marker-end="url(#arr)"/>
    <path d="M580 138 L580 188" marker-end="url(#arr)"/>
    <path d="M840 138 L607 190" marker-end="url(#arr)"/>
  </g>
  <rect x="482" y="150" width="196" height="24" rx="12" fill="#f4f4f5" stroke="#e4e4e7"/>
  <text x="580" y="166" text-anchor="middle" font-size="11" fill="#52525b">HTTPS · WebSocket</text>

  <!-- ================= server ================= -->
  <rect x="330" y="196" width="500" height="210" rx="14" fill="#ffffff" stroke="#d4d4d8"/>
  <rect x="344" y="198" width="472" height="4" rx="2" fill="url(#accent)" opacity="0.85"/>
  <text x="580" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#18181b">PrivateDrop · Single Container</text>
  <text x="580" y="252" text-anchor="middle" font-size="11" fill="#71717a">Alpine · runs as non-root · Docker Compose</text>

  <g>
    <rect x="344" y="266" width="148" height="122" rx="10" fill="#fafafa" stroke="#e4e4e7"/>
    <text x="418" y="290" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18181b">Go API</text>
    <g font-size="10.5" fill="#52525b">
      <text x="358" y="312">· Chi router</text>
      <text x="358" y="330">· JWT dual tokens</text>
      <text x="358" y="348">· Streaming upload</text>
      <text x="358" y="366">· Range resume</text>
    </g>

    <rect x="506" y="266" width="148" height="122" rx="10" fill="#fafafa" stroke="#e4e4e7"/>
    <text x="580" y="290" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18181b">Realtime</text>
    <g font-size="10.5" fill="#52525b">
      <text x="520" y="312">· WebSocket Hub</text>
      <text x="520" y="330">· Instant broadcast</text>
      <text x="520" y="348">· Cursor re-sync</text>
    </g>

    <rect x="668" y="266" width="148" height="122" rx="10" fill="#fafafa" stroke="#e4e4e7"/>
    <text x="742" y="290" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18181b">Cleanup Worker</text>
    <g font-size="10.5" fill="#52525b">
      <text x="682" y="312">· 24h ephemeral</text>
      <text x="682" y="330">· 30d trash purge</text>
      <text x="682" y="348">· Orphan sweep</text>
    </g>
  </g>

  <!-- arrows server -> data -->
  <g stroke="#d4d4d8" stroke-width="1.5" fill="none">
    <path d="M470 410 L398 448" marker-end="url(#arr)"/>
    <path d="M690 410 L762 448" marker-end="url(#arr)"/>
  </g>

  <!-- ================= data layer ================= -->
  <g>
    <rect x="220" y="452" width="330" height="90" rx="12" fill="#fafafa" stroke="#e4e4e7"/>
    <g transform="translate(252,472) scale(1.0)" fill="none" stroke="#3f3f46" stroke-width="1.8">
      <ellipse cx="12" cy="5.5" rx="8" ry="3.2"/>
      <path d="M4 5.5 v12.5 c0 1.8 3.6 3.2 8 3.2 s8 -1.4 8 -3.2 V5.5"/>
      <path d="M4 12 c0 1.8 3.6 3.2 8 3.2 s8 -1.4 8 -3.2"/>
    </g>
    <text x="290" y="490" font-size="13.5" font-weight="600" fill="#18181b">PostgreSQL 16</text>
    <text x="290" y="510" font-size="10.5" fill="#71717a">items · devices · trash · revoked JTI</text>

    <rect x="610" y="452" width="330" height="90" rx="12" fill="#fafafa" stroke="#e4e4e7"/>
    <g transform="translate(642,470) scale(1.0)" fill="none" stroke="#3f3f46" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3 L21 8 L12 13 L3 8 Z"/>
      <path d="M3 12 L12 17 L21 12"/>
      <path d="M3 16 L12 21 L21 16"/>
    </g>
    <text x="680" y="490" font-size="13.5" font-weight="600" fill="#18181b">CAS File Storage</text>
    <text x="680" y="510" font-size="10.5" fill="#71717a">SHA-256 chunked · ./data/storage</text>
  </g>
</svg>
